[package]
name = "czech-surname-restorator"
version = "1.0.0"
edition = "2021"
authors = ["Jan Alexandr Kopřiva <jan.alexandr.kopriva@gmail.com>"]
description = "Restores diacritics to Czech surnames in CSV files."
license = "MIT"
repository = "https://github.com/koprjaa/czech-surname-restorator"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-general-category = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
